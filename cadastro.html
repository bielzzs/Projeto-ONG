<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se como voluntário ou doador na ONG TransformAção.">
    <title>Cadastro | ONG TransformAção</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=240&q=80" alt="Logotipo da ONG TransformAção" width="150" height="50">
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos & Doações</a></li>
                <li><a href="cadastro.html" aria-current="page">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main class="cadastro-page">
        <div class="cadastro-container reveal-on-scroll">
            <section class="cadastro-intro">
                <h1>Junte-se a nós</h1>
                <p>Preencha o formulário abaixo para se cadastrar em nossa plataforma.</p>
                <div class="interest-list">
                    <span>Voluntariado</span>
                    <span>Doações</span>
                    <span>Parcerias</span>
                    <span>Eventos</span>
                </div>
            </section>

            <form action="#" method="POST" autocomplete="on" class="cadastro-form">
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Ex: João da Silva">
                    <br><br>

                    <label for="email">E-mail Institucional ou Pessoal:</label>
                    <input type="email" id="email" name="email" required placeholder="joao@exemplo.com">
                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)">
                    <br><br>

                    <label for="telefone">Telefone / Celular:</label>
                    <input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\) \d{4,5}-\d{4}" placeholder="(11) 90000-0000" maxlength="15" oninput="mascaraTelefone(this)">
                    <br><br>

                    <label for="data_nascimento">Data de Nascimento:</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000" maxlength="9" oninput="mascaraCEP(this)">
                    <br><br>

                    <label for="endereco">Logradouro (Rua, Avenida):</label>
                    <input type="text" id="endereco" name="endereco" required placeholder="Ex: Rua das Flores, 123">
                    <br><br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                    <br><br>

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="" disabled selected>Selecione seu Estado</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="BA">Bahia</option>
                    </select>
                </fieldset>

                <div class="form-actions">
                    <button type="submit">Finalizar Cadastro</button>
                    <button type="reset" class="secondary">Limpar Dados</button>
                </div>
                <div class="form-status" aria-live="polite"></div>
            </form>
        </div>
    </main>

    <footer>
        <p><small>&copy; <span data-current-year></span> ONG TransformAção. Seus dados estão seguros e protegidos segundo a LGPD.</small></p>
    </footer>

    <script src="script.js"></script>
    <script>
        function mascaraCPF(cpf) {
            let valor = cpf.value.replace(/\D/g, "");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            cpf.value = valor;
        }

        function mascaraTelefone(telefone) {
            let valor = telefone.value.replace(/\D/g, "");
            valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
            valor = valor.replace(/(\d)(\d{4})$/, "$1-$2");
            telefone.value = valor;
        }

        function mascaraCEP(cep) {
            let valor = cep.value.replace(/\D/g, "");
            valor = valor.replace(/^(\d{5})(\d)/, "$1-$2");
            cep.value = valor;
        }
    </script>
</body>
</html>
